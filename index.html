<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temu男装模特图库</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;padding:20px}
        .img-modal.active{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
        .arrow{font-size:40px;color:#fff;cursor:pointer;padding:12px}
        /* 顶部固定栏 */
        .top-bar{position:sticky;top:0;background:#f3f4f6;padding:16px 0;z-index:99}
    </style>
</head>
<body class="bg-gray-100 max-w-7xl mx-auto">
    <!-- 永久置顶区域 -->
    <div class="top-bar px-4 md:px-8">
        <h1 class="text-3xl font-bold text-center mb-4">Temu男装模特图库</h1>
        <div class="flex gap-3 items-center">
            <button id="backHomeBtn" class="px-4 py-2 bg-gray-500 text-white rounded hidden">← 返回首页</button>
            <input id="searchInput" placeholder="输入款号搜索（例如BM564）" class="flex-1 p-3 rounded border text-lg">
        </div>
    </div>

    <!-- 主内容容器 -->
    <div class="px-4 md:px-8 py-6">
        <div id="pageHome">
            <div id="galleryHome" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>
        <div id="pageDetail" class="hidden">
            <h2 class="text-xl font-bold mb-4">款号：<span id="detailCode"></span></h2>
            <div id="galleryDetail" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-4"></div>
        </div>
    </div>

    <!--大图弹窗-->
    <div class="img-modal" id="modal">
        <div class="flex items-center gap-4">
            <span class="arrow" onclick="prevPic()">&lsaquo;</span>
            <img id="modalImg" style="max-height:82vh;max-width:85%;">
            <span class="arrow" onclick="nextPic()">&rsaquo;</span>
        </div>
        <div class="flex gap-4 mt-3">
            <a id="downloadLink" download class="bg-blue-500 text-white px-5 py-2 rounded">下载原图</a>
            <button onclick="closeModal()" class="bg-gray-600 text-white px-5 py-2 rounded">关闭</button>
        </div>
    </div>

<script>
// =====================款式数据【在这里新增款式】=====================
const dataList = [
    {
        code:"BM564",
        imgs:[
            "pic/BM564/BM564-1.jpg", "pic/BM564/BM564-2.jpg","pic/BM564/BM564-3.jpg","pic/BM564/BM564-4.jpg","pic/BM564/BM564-5.jpg",
            "pic/BM564/BM564-6.jpg","pic/BM564/BM564-7.jpg","pic/BM564/BM564-8.jpg","pic/BM564/BM564-9.jpg","pic/BM564/BM564-10.jpg"
        ],
        note:"Temu男装 BM564模特图"
    }
    /*新增款式模板，粘贴到上方大括号后面，前面加上英文逗号
    ,{
        code:"BM565",
        imgs:["pic/BM565/BM565-1.jpg","pic/BM565/BM565-2.jpg"],
        note:"Temu男装 BM565模特图"
    }
    */
];
// =====================================================================
let nowImgs = [];
let nowIndex = 0;
//DOM元素
const pageHome = document.getElementById('pageHome');
const pageDetail = document.getElementById('pageDetail');
const galleryHome = document.getElementById('galleryHome');
const galleryDetail = document.getElementById('galleryDetail');
const searchDom = document.getElementById('searchInput');
const backHomeBtn = document.getElementById('backHomeBtn');
const detailCodeDom = document.getElementById('detailCode');
const modalDom = document.getElementById('modal');
const modalImage = document.getElementById('modalImg');

//切换到首页
function showHome(){
    pageHome.classList.remove('hidden');
    pageDetail.classList.add('hidden');
    backHomeBtn.classList.add('hidden');
    renderHome(dataList);
}

//切换到详情页
function showDetail(item){
    pageHome.classList.add('hidden');
    pageDetail.classList.remove('hidden');
    backHomeBtn.classList.remove('hidden');
    detailCodeDom.innerText = item.code;
    renderDetail(item);
}

//渲染首页：只展示每个款式第一张图
function renderHome(list){
    galleryHome.innerHTML = "";
    if(list.length === 0){
        galleryHome.innerHTML = "<p class='col-span-full text-center text-gray-500 text-xl'>未找到对应款号</p>";
        return;
    }
    list.forEach(item=>{
        const card = document.createElement('div');
        card.className = "bg-white rounded shadow overflow-hidden";
        card.innerHTML = `
            <img src="${item.imgs[0]}" class="w-full aspect-[3/4] object-cover cursor-pointer hover:opacity-90">
            <div class="p-3">
                <div class="font-semibold">款号：${item.code}</div>
                <div class="text-sm text-gray-500">共${item.imgs.length}张（点击进入查看全部）</div>
                <div class="text-sm text-gray-600 mt-1">${item.note}</div>
            </div>
        `;
        //点击卡片进入详情页
        card.querySelector('img').onclick = ()=>showDetail(item);
        galleryHome.appendChild(card);
    })
}

//渲染详情页：展示当前款所有图片
function renderDetail(item){
    galleryDetail.innerHTML = "";
    item.imgs.forEach((url,i)=>{
        const card = document.createElement('div');
        card.className = "bg-white rounded shadow overflow-hidden";
        card.innerHTML = `
            <img src="${url}" class="w-full aspect-[3/4] object-cover cursor-pointer hover:opacity-85" data-imgidx="${i}">
            <div class="p-2">
                <a href="${url}" download class="block w-full text-center text-xs bg-green-500 text-white py-1 rounded">下载这张</a>
            </div>
        `;
        card.querySelector('img').onclick = function(){
            openImageSet(item.imgs, Number(this.dataset.imgidx));
        }
        galleryDetail.appendChild(card);
    })
}

//顶部搜索
searchDom.oninput = function(){
    const key = this.value.trim().toLowerCase();
    const filterList = dataList.filter(item=>item.code.toLowerCase().includes(key));
    renderHome(filterList);
    //搜索自动回到首页
    showHome();
}

//返回首页按钮
backHomeBtn.onclick = showHome;

//弹窗预览
function openImageSet(imgs, startIndex=0){
    nowImgs = imgs;
    nowIndex = startIndex;
    refreshModal();
    modalDom.classList.add('active');
}
function refreshModal(){
    modalImage.src = nowImgs[nowIndex];
    document.getElementById('downloadLink').href = nowImgs[nowIndex];
}
function nextPic(){
    nowIndex = (nowIndex+1) % nowImgs.length;
    refreshModal();
}
function prevPic(){
    nowIndex = (nowIndex -1 + nowImgs.length) % nowImgs.length;
    refreshModal();
}
function closeModal(){
    modalDom.classList.remove('active');
}

//点击弹窗黑色空白区域关闭（点击图片内部不会关闭）
modalDom.onclick = function(e){
    if(e.target === modalDom){
        closeModal();
    }
};

// ==========键盘左右按键监听 ==========
document.addEventListener('keydown', function(e){
    // 弹窗打开状态才启用快捷键
    if(!modalDom.classList.contains('active')) return;
    if(e.key === 'ArrowLeft'){
        prevPic();
    }else if(e.key === 'ArrowRight'){
        nextPic();
    }
});

//初始化加载首页
showHome();
</script>
</body>
</html>
